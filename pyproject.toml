[tool.poetry]
name = "pixie-examples"
packages = [
    { include = "examples" }
]

version = "0.1.0"
description = "examples for using Pixie"
authors = ["Yiou Li <yol@gopixie.ai>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pydantic-ai = "^1.39.0"
pixie-sdk = {path = "../pixie-sdk-py", develop = true}
openai-agents = "^0.6.5"
pymarkdownlnt = "^0.9.34"
langchain = "^1.2.3"
langchain-openai = "^1.1.7"
langchain-community = "^0.4.1"
langgraph = "^1.0.5"
langchain-text-splitters = "^1.1.0"
beautifulsoup4 = "^4.14.3"
lxml = "^6.0.2"
requests = "^2.32.5"
